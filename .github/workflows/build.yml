name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub Actions does not allow the `secrets` context to be used directly
    # inside a step's `if:` condition - it must go through a plain env var
    # first. HAS_RELEASE_SIGNING is that flag: 'true' once the 4 signing
    # secrets are added on the repo, 'false' otherwise. Every release-signing
    # step below is gated on this flag, so the debug build always still runs
    # even if signing isn't set up yet.
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_KEYSTORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-disabled: true

      # Decodes the base64 keystore secret back into a .jks file on the
      # runner. Only runs once all 4 signing secrets are present on the repo.
      - name: Decode signing keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Keystore decoded, size: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pix-gallery-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Upload signed release APK artifact
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pix-gallery-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Signing secrets missing (info)
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "::warning::One or more of RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD secrets is missing, so only the debug APK was built. Add all 4 repo secrets to also get a signed release APK."
