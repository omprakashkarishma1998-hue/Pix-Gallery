name: Build APK

# Yeh workflow har push aur pull request par debug APK build karega
# aur usko "Actions" tab me Artifact ke roop me daal dega (download kar sakte ho).

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ye action khud Gradle install karta hai, isliye local
      # gradle-wrapper.jar na hone par bhi build chal jayega.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pix-gallery-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
